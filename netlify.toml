[build]
  base = "frontend"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.4"
  EXPO_PUBLIC_BACKEND_URL = "https://controle-presenca-futebol.onrender.com"

# SPA fallback for Expo Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
